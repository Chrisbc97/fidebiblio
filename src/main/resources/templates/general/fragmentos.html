<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <!-- Fragmento #1: head -->
    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <title>FideBiblio</title>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    </head>
    <body>
        <!-- Fragmento #2: barra lateral -->
        <div th:fragment="sidebar" class="app-sidebar">
            <a th:href="@{/}" class="brand"><i class="fa-solid fa-book"></i> FideBiblio</a>
            <a class="nav-link" th:href="@{/}"><i class="fa-solid fa-house"></i> Catálogo</a>
            <a class="nav-link" th:href="@{/prestamo/historial}"><i class="fa-solid fa-clock-rotate-left"></i> Mis Préstamos</a>
            <a class="nav-link" th:href="@{/reserva/listado}"><i class="fa-solid fa-bookmark"></i> Mis Reservas</a>
            <a class="nav-link" th:href="@{/multa/listado}"><i class="fa-solid fa-money-bill-wave"></i> Mis Multas</a>
            <a class="nav-link" th:href="@{/sugerencia/listado}"><i class="fa-solid fa-lightbulb"></i> Sugerencias</a>
            <hr style="border-color: rgba(255,255,255,0.2);"/>
            <div sec:authorize="hasAnyRole('ADMINISTRADOR','BIBLIOTECARIO')">
                <small class="text-uppercase text-white-50 px-2">Secciones</small>
                <a class="nav-link" th:href="@{/libro/listado}"><i class="fa-solid fa-book-open"></i> Gestión de Libros</a>
                <a class="nav-link" th:href="@{/prestamo/listado}"><i class="fa-solid fa-calendar-check"></i> Préstamos</a>
                <a class="nav-link" th:href="@{/multa/pendientes}"><i class="fa-solid fa-coins"></i> Multas Pendientes</a>
                <a class="nav-link" th:href="@{/reporte/listado}"><i class="fa-solid fa-chart-line"></i> Analíticas</a>
            </div>
            <div sec:authorize="hasRole('ADMINISTRADOR')">
                <a class="nav-link" th:href="@{/usuario/listado}"><i class="fa-solid fa-users"></i> Usuarios</a>
                <a class="nav-link" th:href="@{/configuracion/listado}"><i class="fa-solid fa-gear"></i> Configuración</a>
            </div>
        </div>
        <!-- Fragmento #3: barra superior, con notificaciones, nombre de usuario y logout -->
        <div th:fragment="topbar" class="app-topbar d-flex justify-content-between align-items-center">
            <h5 class="mb-0"></h5>
            <div class="d-flex align-items-center gap-3">
                <div class="dropdown" id="campanitaNotificaciones">
                    <button class="btn btn-outline-secondary btn-sm position-relative" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-bell"></i>
                        <span th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${notificacionesNoLeidas}"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end p-2" style="min-width: 300px; max-height: 350px; overflow-y: auto;">
                        <li th:each="n : ${notificacionesRecientes}" class="mb-1">
                            <div class="small p-2 border-bottom" th:classappend="${!n.leida} ? 'fw-bold' : 'text-muted'">
                                <span th:text="${n.mensaje}"></span>
                                <div class="text-muted" style="font-size:0.75rem;" th:text="${#temporals.format(n.fechaCreacion,'dd/MM/yyyy HH:mm')}"></div>
                            </div>
                        </li>
                        <li th:if="${#lists.isEmpty(notificacionesRecientes)}" class="text-center text-muted small p-2">
                            Sin notificaciones
                        </li>
                    </ul>
                </div>
                <span><i class="fa-solid fa-circle-user"></i> <span sec:authentication="name"></span></span>
                <form method="post" th:action="@{/logout}" class="mb-0">
                    <button class="btn btn-sm btn-outline-secondary" type="submit">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </form>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    var campanita = document.getElementById('campanitaNotificaciones');
                    if (campanita) {
                        campanita.addEventListener('shown.bs.dropdown', function () {
                            fetch('/notificacion/marcar-leidas');
                        });
                    }
                });
            </script>
        </div>
        <!-- Fragmento #4: mensajes de éxito o error -->
        <div th:fragment="mostrarToast" class="container-fluid mt-3">
            <div th:if="${todoOk}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${todoOk}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>
    </body>
</html>
