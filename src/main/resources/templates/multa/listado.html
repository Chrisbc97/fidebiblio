<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>

        <div class="app-layout">
            <div th:replace="~{general/fragmentos :: sidebar}"></div>

            <div class="app-content">
                <div th:replace="~{general/fragmentos :: topbar}"></div>
                <div th:replace="~{general/fragmentos :: mostrarToast}"></div>

                <section class="container-fluid p-4">
                    <h3 style="color:#0f2a4a;">Mis Multas</h3>

                    <table class="table table-striped table-hover bg-white">
                        <thead>
                            <tr>
                                <th>Libro</th>
                                <th>Días de atraso</th>
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${multas}">
                                <td th:text="${m.prestamo.libro.titulo}"></td>
                                <td th:text="${m.diasAtraso}"></td>
                                <td th:text="${'₡' + m.monto}"></td>
                                <td>
                                    <span th:if="${m.estado == 'PENDIENTE'}" class="badge badge-prestado">Pendiente</span>
                                    <span th:if="${m.estado == 'PAGADA'}" class="badge badge-disponible">Pagada</span>
                                </td>
                                <td th:text="${#temporals.format(m.fechaGeneracion,'dd/MM/yyyy')}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(multas)}">
                                <td colspan="5" class="text-center text-muted">No tiene multas registradas</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>

    </body>
</html>
